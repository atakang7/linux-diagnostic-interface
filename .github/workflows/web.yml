name: Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: CI=true npm run build
      - name: Test
        run: CI=true npm test -- --runInBand --passWithNoTests
